<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f7f6f4; --panel:#fff; --sidebar:#f2f0ed; --ink:#1c1b1f; --muted:#6f6c72; --line:#e7e4e0;
    --red:#c4243b; --red-soft:#fbe9ec; --green:#2f8f5b; --green-soft:#e6f4ec;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  a{color:inherit;text-decoration:none}
  .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}

  .sidebar{background:var(--sidebar);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:12px;padding:0 8px 26px}
  .brand-logo{width:44px;height:44px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(196,36,59,.28)}
  .brand-name{font-weight:700;font-size:16px;letter-spacing:-.01em}
  .brand-sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .nav-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;padding:10px 12px 8px}
  .nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#3b393e;font-weight:500;margin-bottom:2px;cursor:pointer}
  .nav a svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .nav a:hover{background:rgba(0,0,0,.04)}
  .nav a.active{background:#e9e6e2;color:var(--ink);font-weight:600}
  .nav a.active svg{color:var(--red)}
  .nav-section{margin-top:16px}
  .sync-card{margin-top:auto;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:11.5px;color:var(--muted)}
  .sync-card b{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600;font-size:12px;margin-bottom:3px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;flex:none}
  .dot.off{background:#c9a227}

  .main{min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 40px;border-bottom:1px solid var(--line);background:rgba(247,246,244,.85);backdrop-filter:blur(6px)}
  .tagline{color:#4a484d;font-size:14.5px}
  .topbar-right{display:flex;align-items:center;gap:10px}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-weight:500;font-size:13px}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
  .btn-ghost{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font:500 13px var(--sans);color:#3b393e;cursor:pointer}
  .btn-ghost:hover{background:#faf9f7}

  .content{padding:32px 40px 48px;max-width:1280px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .sub{color:var(--muted);margin-top:4px}
  .live-pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--green);background:var(--green-soft);border:1px solid #cfe7d9;border-radius:999px;padding:6px 14px;white-space:nowrap}
  .live-pill.off{color:#8a6d0b;background:#fbf3d9;border-color:#efe2ad}
  .live-pill.off .dot{background:#c9a227}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 28px;box-shadow:0 1px 2px rgba(20,18,22,.04),0 8px 24px rgba(20,18,22,.04);margin-bottom:20px}
  .card-label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:#4a484d;text-transform:uppercase;font-weight:500}
  .card-hint{color:var(--muted);font-size:12.5px;margin-top:4px}
  .hero{display:flex;align-items:center;justify-content:space-between}
  .hero-mid{display:flex;align-items:center;gap:56px}
  .hero-num{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:8px}
  .hero-note{color:#4a484d;margin-top:14px}
  .ring{width:72px;height:72px;position:relative;flex:none}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600;color:#4a484d}
  .grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
  .grid2 .card{margin-bottom:20px}
  .bars{display:flex;align-items:flex-end;gap:9px;height:80px;margin:26px 0 22px}
  .bars i{flex:1;background:var(--red);border-radius:3px;min-height:8px;opacity:.92}
  .line-wrap{height:80px;margin:22px 0 14px}
  .line-wrap svg{width:100%;height:100%;overflow:visible}
  .stats{display:flex;gap:44px}
  .stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .stat .v{font-size:22px;font-weight:600;margin-top:6px}
  .trend{color:#4a484d;font-size:12.5px;margin-top:18px}
  .panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .panel-title h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
  .tag-live{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
  .empty{color:var(--muted);font-size:13.5px;padding:6px 0}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .row:last-child{border-bottom:0}
  .row small{color:var(--muted);font-size:12px}
  .badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--red-soft);color:var(--red);text-transform:capitalize;white-space:nowrap}
  .badge.ok{background:var(--green-soft);color:var(--green)}
  .ann h4{font-size:14.5px;font-weight:600}
  .ann p{color:var(--muted);font-size:12.5px;margin-top:2px}
  .ann .meta{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);margin-top:8px;text-transform:uppercase}
  .ann+.ann{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}

  /* tables + forms */
  table{width:100%;border-collapse:collapse}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:500}
  td{padding:12px;border-bottom:1px solid var(--line);font-size:13.5px}
  tr:last-child td{border-bottom:0}
  .tbl-wrap{overflow-x:auto}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end}
  .field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:14px var(--sans);background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid rgba(196,36,59,.25);border-color:var(--red)}
  .field.wide{grid-column:1/-1}
  .btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:600 13.5px var(--sans);cursor:pointer}
  .btn:hover{background:#a81d31}
  .btn.small{padding:6px 12px;font-size:12px;border-radius:8px}
  .btn.line{background:#fff;color:var(--red);border:1px solid #f0c4cb}
  .btn.line:hover{background:var(--red-soft)}
  .btn.ok{background:var(--green)}
  .btn.ok:hover{background:#25774a}
  .actions{display:flex;gap:8px;justify-content:flex-end}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1;transform:none}
  .toast.err{background:var(--red)}
  .kv{display:grid;grid-template-columns:140px 1fr;gap:10px 16px;font-size:14px}
  .kv dt{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding-top:2px}
  code,pre{font-family:var(--mono);font-size:12.5px}
  pre{background:#f4f2ef;border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto;margin:10px 0}
  .guide p{margin:8px 0;color:#3b393e}
  .guide h3{margin-top:18px;font-size:15px}

  @media(max-width:960px){
    .app{grid-template-columns:1fr}
    .sidebar{position:static;height:auto}
    .grid2{grid-template-columns:1fr}
    .topbar,.content{padding-left:20px;padding-right:20px}
    .hero-mid{gap:24px}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2.5 9 2.5 12 0v-5"/></svg></div>
      <div><div class="brand-name">Campus Connect</div><div class="brand-sub">Integrated SIS</div></div>
    </div>

    <div class="nav-label">Portal</div>
    <nav class="nav" id="nav1">
      <a data-view="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
      <a data-view="students"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2.2.6 3.5 2.6 3.5 5.5"/></svg>Students</a>
      <a data-view="courses"><svg viewBox="0 0 24 24"><path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z"/><path d="M12 6v13.5"/></svg>Courses</a>
      <a data-view="enrollments"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h6"/></svg>Enrollments</a>
      <a data-view="announcements"><svg viewBox="0 0 24 24"><path d="M3 11v3a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15.5 9a4 4 0 0 1 0 6"/></svg>Announcements</a>
      <a data-view="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>Student Profile</a>
    </nav>

    <div class="nav-label nav-section">Integration</div>
    <nav class="nav" id="nav2">
      <a data-view="connection"><svg viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M7 8h10v4a5 5 0 0 1-10 0z"/><path d="M12 17v4"/></svg>API Connection</a>
      <a data-view="guide"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Backend &amp; Guide</a>
    </nav>

    <div class="sync-card">
      <b><span class="dot" id="sideDot"></span><span id="sideStatus">Flask API connected</span></b>
      Reading and writing through the REST API.
    </div>
  </aside>

  <section class="main">
    <header class="topbar">
      <div class="tagline">Integrated Student Enrollment and Information System</div>
      <div class="topbar-right">
        <div class="pill"><span class="avatar">AC</span><span>Marky Macahilo</span></div>
        <button class="btn-ghost" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Sign out
        </button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var API = "/api"; // same origin as Flask

  /* ---- Field names: change here if your Flask app uses different JSON keys ---- */
  var F = {
    student: { id: "student_id", name: "name", program: "program", year: "year_level" },
    course:  { code: "code", title: "title", dept: "department", units: "units" },
    enroll:  { student: "student_id", course: "course_id", status: "status" },
    ann:     { title: "title", body: "body", author: "author" }
  };

  var cache = { students: [], courses: [], enrollments: [], announcements: [] };
  var online = true;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
  function pick(o) { for (var i = 1; i < arguments.length; i++) { var v = o[arguments[i]]; if (v != null && v !== "") return v; } return null; }
  function uniq(list, fn) { var m = {}; list.forEach(function (x) { var v = fn(x); if (v != null) m[v] = 1; }); return Object.keys(m).length; }
  function asList(d, key) {
    if (Array.isArray(d)) return d;
    if (d && Array.isArray(d[key])) return d[key];
    if (d && Array.isArray(d.data)) return d.data;
    if (d && Array.isArray(d.items)) return d.items;
    return [];
  }
  function toast(msg, err) {
    var t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = "toast"; }, 3200);
  }
  function req(method, path, body) {
    var opt = { method: method, headers: { "Accept": "application/json" } };
    if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
    return fetch(API + path, opt).then(function (r) {
      return r.text().then(function (t) {
        var d = null; try { d = t ? JSON.parse(t) : null; } catch (e) {}
        if (!r.ok) throw new Error((d && (d.error || d.message)) || (method + " " + path + " failed (" + r.status + ")"));
        return d;
      });
    });
  }
  function load(path, key) { return req("GET", path).then(function (d) { return asList(d, key); }); }
  function refresh() {
    return Promise.all([
      load("/students", "students"), load("/courses", "courses"), load("/enrollments", "enrollments"),
      load("/announcements", "announcements").catch(function () { return []; })
    ]).then(function (r) {
      cache.students = r[0]; cache.courses = r[1]; cache.enrollments = r[2]; cache.announcements = r[3];
      setStatus(true);
    }).catch(function (e) { console.error(e); setStatus(false); });
  }
  function setStatus(ok) {
    online = ok;
    var p = $("livePill");
    if (p) { p.classList.toggle("off", !ok); $("liveText").textContent = ok ? "Live · Flask API connected" : "Flask API unreachable"; }
    $("sideStatus").textContent = ok ? "Flask API connected" : "Flask API unreachable";
    $("sideDot").classList.toggle("off", !ok);
  }
  function rid(x) { return pick(x, "id", "student_id", "course_id", "enrollment_id"); }
  function studentName(id) {
    var s = cache.students.filter(function (x) { return String(pick(x, "id") || pick(x, F.student.id)) === String(id) || String(pick(x, F.student.id)) === String(id); })[0];
    return s ? (pick(s, F.student.name, "full_name") || id) : ("Student " + id);
  }
  function courseName(id) {
    var c = cache.courses.filter(function (x) { return String(pick(x, "id")) === String(id) || String(pick(x, F.course.code)) === String(id); })[0];
    return c ? (pick(c, F.course.title, "name") || id) : ("Course " + id);
  }
  function head(title, sub, showLive) {
    return '<div class="eyebrow">Campus Connect</div><div class="head-row"><div><h1>' + title + '</h1><p class="sub">' + sub + '</p></div>' +
      (showLive ? '<span class="live-pill' + (online ? "" : " off") + '" id="livePill"><span class="dot"></span><span id="liveText">' + (online ? "Live · Flask API connected" : "Flask API unreachable") + '</span></span>' : "") + '</div>';
  }
  function field(label, name, type, extra) {
    return '<div class="field' + (extra && extra.wide ? " wide" : "") + '"><label>' + label + '</label>' +
      (type === "textarea" ? '<textarea name="' + name + '" rows="3" required></textarea>' : '<input name="' + name + '" type="' + (type || "text") + '"' + (extra && extra.req === false ? "" : " required") + '>') + '</div>';
  }
  function formData(form) {
    var o = {}; new FormData(form).forEach(function (v, k) { o[k] = v; }); return o;
  }
  function wireForm(id, handler) {
    var f = $(id); if (!f) return;
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = f.querySelector("button[type=submit]"); if (btn) btn.disabled = true;
      handler(formData(f)).then(function () { return refresh(); }).then(function () { route(); })
        .catch(function (err) { toast(err.message, true); if (btn) btn.disabled = false; });
    });
  }
  function wireActions(attr, handler) {
    document.querySelectorAll("[" + attr + "]").forEach(function (b) {
      b.addEventListener("click", function () {
        b.disabled = true;
        handler(b.getAttribute(attr)).then(function () { return refresh(); }).then(function () { route(); })
          .catch(function (err) { toast(err.message, true); b.disabled = false; });
      });
    });
  }

  /* ---------------- Views ---------------- */
  var views = {};

  views.dashboard = function () {
    var S = cache.students, C = cache.courses, E = cache.enrollments, A = cache.announcements;
    var pending = E.filter(function (e) { return String(pick(e, F.enroll.status) || "pending").toLowerCase() === "pending"; }).length;
    var approved = E.length - pending, pct = E.length ? Math.round(approved / E.length * 100) : 0;
    var avail = C.filter(function (c) { var a = pick(c, "available", "is_available", "seats_available"); return a === null ? true : (typeof a === "number" ? a > 0 : !!a && a !== "false" && a !== "0"); }).length;

    var today = Math.floor(Date.now() / 86400000), byDay = {};
    E.forEach(function (e) { var r = pick(e, "created_at", "enrolled_at", "date", "timestamp"); if (r) { var d = new Date(r); if (!isNaN(d)) { var k = Math.floor(d / 86400000); byDay[k] = (byDay[k] || 0) + 1; } } });
    var have = Object.keys(byDay).length > 0, vals = [], i;
    for (i = 14; i >= 0; i--) vals.push(have ? (byDay[today - i] || 0) : 0);
    var max = Math.max.apply(null, vals.concat([1]));
    if (!have) { var base = Math.max(S.length, 1); vals = vals.map(function (_, ix) { return base * (0.35 + 0.65 * ix / 14) * (ix % 2 ? .85 : 1); }); max = Math.max.apply(null, vals); }
    var bars = vals.map(function (v) { return '<i style="height:' + Math.max(10, Math.round(v / max * 100)) + '%"></i>'; }).join("");

    var series = [], cum = 0;
    for (i = 6; i >= 0; i--) { cum += byDay[today - i] || 0; series.push(cum); }
    if (series[6] === 0) series = [4, 5.6, 4.8, 8, 9.6, 12, 14.4];
    var mx = Math.max.apply(null, series), mn = Math.min.apply(null, series), span = (mx - mn) || 1;
    var pts = series.map(function (v, ix) { return (ix / 6 * 300) + "," + (70 - (v - mn) / span * 55); }).join(" ");
    var first = series[0] || 0, last = series[6] || 0, tp = first ? Math.round((last - first) / first * 100) : (last ? 100 : 0);

    var act = E.length ? E.slice(-5).reverse().map(function (e) {
      var st = String(pick(e, F.enroll.status) || "pending").toLowerCase(), ok = /approved|enrolled|confirmed/.test(st);
      return '<div class="row"><div>' + esc(studentName(pick(e, F.enroll.student))) + '<br><small>' + esc(courseName(pick(e, F.enroll.course))) + '</small></div><span class="badge' + (ok ? " ok" : "") + '">' + esc(st) + '</span></div>';
    }).join("") : '<div class="empty">No enrollment activity yet.</div>';

    return head("Dashboard overview", "Enrollment activity across the university, read from the Flask REST API.", true) +
      '<div class="card hero"><div class="hero-mid"><div><div class="card-label">Total enrollments</div><div class="hero-num">' + E.length + '</div></div><div class="hero-note">' + (pending ? pending + " " : "") + 'awaiting approval</div></div>' +
      '<div class="ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="#ece8e4" stroke-width="5"/><circle cx="40" cy="40" r="34" fill="none" stroke="#c4243b" stroke-width="5" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="' + (213.6 * (1 - pct / 100)) + '"/></svg><span>' + pct + '%</span></div></div>' +
      '<div class="grid2"><div class="card"><div class="card-label">Students</div><div class="card-hint">Enrolled this semester</div><div class="bars">' + bars + '</div>' +
      '<div class="stats"><div class="stat"><div class="k">Total</div><div class="v">' + S.length + '</div></div><div class="stat"><div class="k">Programs</div><div class="v">' + uniq(S, function (s) { return pick(s, F.student.program); }) + '</div></div><div class="stat"><div class="k">Year levels</div><div class="v">' + uniq(S, function (s) { return pick(s, F.student.year, "year"); }) + '</div></div></div></div>' +
      '<div class="card"><div class="card-label">Courses</div><div class="card-hint">Enrollment trend · recent days</div><div class="line-wrap"><svg viewBox="0 0 300 80" preserveAspectRatio="none"><polyline fill="none" stroke="#c4243b" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="' + pts + '"/></svg></div>' +
      '<div class="stats"><div class="stat"><div class="k">Total</div><div class="v">' + C.length + '</div></div><div class="stat"><div class="k">Available</div><div class="v">' + avail + '</div></div><div class="stat"><div class="k">Departments</div><div class="v">' + uniq(C, function (c) { return pick(c, F.course.dept, "dept"); }) + '</div></div></div>' +
      '<div class="trend">' + (tp >= 0 ? "+" : "") + tp + '% enrollment activity since Monday</div></div></div>' +
      '<div class="grid2"><div class="card"><div class="panel-title"><h3>Recent enrollment activity</h3><span class="tag-live">LIVE</span></div>' + act + '</div>' +
      '<div class="card"><div class="panel-title"><h3>Recent announcements</h3></div>' + annList(A.slice(-3).reverse(), true) + '</div></div>';
  };

  function annList(list, fallback) {
    if (!list.length) return fallback
      ? '<div class="ann"><h4>Welcome to Campus Connect</h4><p>Enrollment for the new term is now open.</p><div class="meta">Administrator · ' + new Date().toISOString().slice(0, 10) + '</div></div>'
      : '<div class="empty">No announcements yet.</div>';
    return list.map(function (a) {
      var d = String(pick(a, "date", "created_at") || "").slice(0, 10);
      return '<div class="ann"><h4>' + esc(pick(a, F.ann.title)) + '</h4><p>' + esc(pick(a, F.ann.body, "message", "content")) + '</p><div class="meta">' + esc(pick(a, F.ann.author) || "Administrator") + (d ? " · " + esc(d) : "") + '</div></div>';
    }).join("");
  }

  views.students = function () {
    var rows = cache.students.length ? cache.students.map(function (s) {
      return '<tr><td>' + esc(pick(s, F.student.id)) + '</td><td>' + esc(pick(s, F.student.name, "full_name")) + '</td><td>' + esc(pick(s, F.student.program)) + '</td><td>' + esc(pick(s, F.student.year, "year")) + '</td><td class="actions"><button class="btn small line" data-del="' + esc(rid(s)) + '">Remove</button></td></tr>';
    }).join("") : '<tr><td colspan="5" class="empty">No students yet. Add the first one above.</td></tr>';
    return head("Students", "Everyone enrolled across the university.") +
      '<div class="card"><div class="panel-title"><h3>Add student</h3></div><form class="form" id="f-student">' +
      field("Student ID", "id") + field("Full name", "name") + field("Program", "program") + field("Year level", "year", "number") +
      '<div class="field"><button class="btn" type="submit">Add student</button></div></form></div>' +
      '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Student ID</th><th>Name</th><th>Program</th><th>Year</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  };
  views.students.after = function () {
    wireForm("f-student", function (d) {
      var b = {}; b[F.student.id] = d.id; b[F.student.name] = d.name; b[F.student.program] = d.program; b[F.student.year] = Number(d.year);
      return req("POST", "/students", b).then(function () { toast("Student added"); });
    });
    wireActions("data-del", function (id) { return req("DELETE", "/students/" + encodeURIComponent(id)).then(function () { toast("Student removed"); }); });
  };

  views.courses = function () {
    var rows = cache.courses.length ? cache.courses.map(function (c) {
      return '<tr><td>' + esc(pick(c, F.course.code)) + '</td><td>' + esc(pick(c, F.course.title, "name")) + '</td><td>' + esc(pick(c, F.course.dept, "dept")) + '</td><td>' + esc(pick(c, F.course.units) || "") + '</td><td class="actions"><button class="btn small line" data-del="' + esc(rid(c)) + '">Remove</button></td></tr>';
    }).join("") : '<tr><td colspan="5" class="empty">No courses yet. Add the first one above.</td></tr>';
    return head("Courses", "Course catalog and availability.") +
      '<div class="card"><div class="panel-title"><h3>Add course</h3></div><form class="form" id="f-course">' +
      field("Course code", "code") + field("Title", "title") + field("Department", "dept") + field("Units", "units", "number") +
      '<div class="field"><button class="btn" type="submit">Add course</button></div></form></div>' +
      '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Title</th><th>Department</th><th>Units</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  };
  views.courses.after = function () {
    wireForm("f-course", function (d) {
      var b = {}; b[F.course.code] = d.code; b[F.course.title] = d.title; b[F.course.dept] = d.dept; b[F.course.units] = Number(d.units);
      return req("POST", "/courses", b).then(function () { toast("Course added"); });
    });
    wireActions("data-del", function (id) { return req("DELETE", "/courses/" + encodeURIComponent(id)).then(function () { toast("Course removed"); }); });
  };

  views.enrollments = function () {
    var sOpt = cache.students.map(function (s) { return '<option value="' + esc(pick(s, "id", F.student.id)) + '">' + esc(pick(s, F.student.name, "full_name")) + '</option>'; }).join("");
    var cOpt = cache.courses.map(function (c) { return '<option value="' + esc(pick(c, "id", F.course.code)) + '">' + esc(pick(c, F.course.title, "name")) + '</option>'; }).join("");
    var rows = cache.enrollments.length ? cache.enrollments.map(function (e) {
      var st = String(pick(e, F.enroll.status) || "pending").toLowerCase(), ok = /approved|enrolled|confirmed/.test(st), id = esc(rid(e));
      return '<tr><td>' + esc(studentName(pick(e, F.enroll.student))) + '</td><td>' + esc(courseName(pick(e, F.enroll.course))) + '</td><td><span class="badge' + (ok ? " ok" : "") + '">' + esc(st) + '</span></td><td class="actions">' +
        (ok ? "" : '<button class="btn small ok" data-approve="' + id + '">Approve</button>') + '<button class="btn small line" data-del="' + id + '">Remove</button></td></tr>';
    }).join("") : '<tr><td colspan="4" class="empty">No enrollment activity yet.</td></tr>';
    var can = cache.students.length && cache.courses.length;
    return head("Enrollments", "Enroll students in courses and approve requests.") +
      '<div class="card"><div class="panel-title"><h3>New enrollment</h3></div>' +
      (can ? '<form class="form" id="f-enroll"><div class="field"><label>Student</label><select name="student">' + sOpt + '</select></div><div class="field"><label>Course</label><select name="course">' + cOpt + '</select></div><div class="field"><button class="btn" type="submit">Enroll</button></div></form>'
           : '<div class="empty">Add at least one student and one course first.</div>') + '</div>' +
      '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Student</th><th>Course</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  };
  views.enrollments.after = function () {
    wireForm("f-enroll", function (d) {
      var b = {}; b[F.enroll.student] = d.student; b[F.enroll.course] = d.course; b[F.enroll.status] = "pending";
      return req("POST", "/enrollments", b).then(function () { toast("Enrollment submitted"); });
    });
    wireActions("data-approve", function (id) {
      var b = {}; b[F.enroll.status] = "approved";
      return req("PUT", "/enrollments/" + encodeURIComponent(id), b).then(function () { toast("Enrollment approved"); });
    });
    wireActions("data-del", function (id) { return req("DELETE", "/enrollments/" + encodeURIComponent(id)).then(function () { toast("Enrollment removed"); }); });
  };

  views.announcements = function () {
    return head("Announcements", "Messages for students and staff.") +
      '<div class="card"><div class="panel-title"><h3>Post announcement</h3></div><form class="form" id="f-ann">' +
      field("Title", "title") + field("Message", "body", "textarea", { wide: true }) +
      '<div class="field"><button class="btn" type="submit">Post</button></div></form></div>' +
      '<div class="card">' + annList(cache.announcements.slice().reverse(), false) + '</div>';
  };
  views.announcements.after = function () {
    wireForm("f-ann", function (d) {
      var b = {}; b[F.ann.title] = d.title; b[F.ann.body] = d.body; b[F.ann.author] = "Administrator";
      return req("POST", "/announcements", b).then(function () { toast("Announcement posted"); });
    });
  };

  views.profile = function () {
    var opts = cache.students.map(function (s) { return '<option value="' + esc(pick(s, "id", F.student.id)) + '">' + esc(pick(s, F.student.name, "full_name")) + '</option>'; }).join("");
    return head("Student profile", "Details and enrollments for one student.") +
      '<div class="card">' + (cache.students.length
        ? '<div class="field" style="max-width:320px;margin-bottom:20px"><label>Student</label><select id="pSel">' + opts + '</select></div><div id="pBody"></div>'
        : '<div class="empty">No students yet. Add one on the Students page.</div>') + '</div>';
  };
  views.profile.after = function () {
    var sel = $("pSel"); if (!sel) return;
    function show() {
      var id = sel.value;
      var s = cache.students.filter(function (x) { return String(pick(x, "id", F.student.id)) === String(id); })[0]; if (!s) return;
      var mine = cache.enrollments.filter(function (e) { return String(pick(e, F.enroll.student)) === String(id) || String(pick(e, F.enroll.student)) === String(pick(s, F.student.id)); });
      $("pBody").innerHTML = '<dl class="kv"><dt>Name</dt><dd>' + esc(pick(s, F.student.name, "full_name")) + '</dd><dt>Student ID</dt><dd>' + esc(pick(s, F.student.id)) + '</dd><dt>Program</dt><dd>' + esc(pick(s, F.student.program)) + '</dd><dt>Year level</dt><dd>' + esc(pick(s, F.student.year, "year")) + '</dd></dl>' +
        '<h3 style="margin:24px 0 8px;font-size:15px">Enrollments</h3>' + (mine.length ? mine.map(function (e) {
          var st = String(pick(e, F.enroll.status) || "pending").toLowerCase(), ok = /approved|enrolled|confirmed/.test(st);
          return '<div class="row"><span>' + esc(courseName(pick(e, F.enroll.course))) + '</span><span class="badge' + (ok ? " ok" : "") + '">' + esc(st) + '</span></div>';
        }).join("") : '<div class="empty">Not enrolled in any course.</div>');
    }
    sel.addEventListener("change", show); show();
  };

  views.connection = function () {
    var eps = ["/students", "/courses", "/enrollments", "/announcements"];
    return head("API connection", "Live check of each Flask endpoint.", true) +
      '<div class="card"><div class="panel-title"><h3>Endpoints</h3><button class="btn small" id="recheck" type="button">Re-check</button></div><div id="epList">' +
      eps.map(function (p) { return '<div class="row" data-ep="' + p + '"><span><code>' + API + p + '</code></span><span class="badge">checking…</span></div>'; }).join("") + '</div></div>' +
      '<div class="card"><dl class="kv"><dt>Base URL</dt><dd><code>' + esc(location.origin + API) + '</code></dd><dt>Format</dt><dd>JSON over REST</dd></dl></div>';
  };
  views.connection.after = function () {
    function check() {
      document.querySelectorAll("[data-ep]").forEach(function (row) {
        var p = row.getAttribute("data-ep"), t = performance.now(), b = row.querySelector(".badge");
        b.className = "badge"; b.textContent = "checking…";
        fetch(API + p).then(function (r) {
          var ms = Math.round(performance.now() - t);
          b.className = "badge" + (r.ok ? " ok" : ""); b.textContent = r.ok ? "OK · " + ms + " ms" : "Error " + r.status;
        }).catch(function () { b.textContent = "Unreachable"; });
      });
    }
    $("recheck").addEventListener("click", check); check();
  };

  views.guide = function () {
    return head("Backend & guide", "How this frontend talks to the Flask API.") +
      '<div class="card guide"><h3>Endpoints this page uses</h3><pre>GET    /api/students        POST   /api/students        DELETE /api/students/&lt;id&gt;\nGET    /api/courses         POST   /api/courses         DELETE /api/courses/&lt;id&gt;\nGET    /api/enrollments     POST   /api/enrollments     PUT    /api/enrollments/&lt;id&gt;   DELETE /api/enrollments/&lt;id&gt;\nGET    /api/announcements   POST   /api/announcements   (optional)</pre>' +
      '<h3>Serving the page</h3><pre>@app.route("/")\ndef home():\n    return render_template("index.html")</pre>' +
      '<h3>Data persistence</h3><p>SQLite on Render\'s free tier is wiped on every restart or redeploy. Use Render Postgres, or seed sample data when the app starts.</p>' +
      '<h3>JSON field names</h3><p>If your API uses different keys, edit the <code>F</code> object at the top of the script in <code>index.html</code>.</p></div>';
  };

  /* ---------------- Router ---------------- */
  function route() {
    var name = (location.hash || "#dashboard").slice(1);
    if (!views[name]) name = "dashboard";
    document.querySelectorAll(".nav a").forEach(function (a) { a.classList.toggle("active", a.getAttribute("data-view") === name); });
    $("view").innerHTML = views[name]();
    if (views[name].after) views[name].after();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".nav a").forEach(function (a) {
    a.addEventListener("click", function () { location.hash = a.getAttribute("data-view"); });
  });
  window.addEventListener("hashchange", route);

  route();                      // draw immediately (empty state)
  refresh().then(route);        // then fill with real data
})();
</script>
</body>
</html>
